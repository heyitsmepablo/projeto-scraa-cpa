name: ${DEV_COMPOSE_PROJECT_NAME:-projeto-scraa-dev}

# ==============================================================================
# Volumes nomeados para desenvolvimento local
# ==============================================================================
volumes:
  postgres_dev_data:
    name: ${DEV_COMPOSE_PROJECT_NAME:-projeto-scraa-dev}_postgres_data
  pgadmin_dev_data:
    name: ${DEV_COMPOSE_PROJECT_NAME:-projeto-scraa-dev}_pgadmin_data

# ==============================================================================
# Rede interna para desenvolvimento local
# ==============================================================================
networks:
  scraa_dev:
    name: ${DEV_COMPOSE_PROJECT_NAME:-projeto-scraa-dev}_network
    driver: bridge

# ==============================================================================
# Serviços de desenvolvimento com hot-reload ativo
# ==============================================================================
services:
  # ── Banco de dados (PostgreSQL 18) ──────────────────────────────────────────
  database:
    image: postgres:18
    container_name: ${DEV_COMPOSE_PROJECT_NAME:-projeto-scraa-dev}-database
    restart: unless-stopped
    ports:
      - "${DEV_DB_PORT:-${DB_PORT:-5432}}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scraa}
      POSTGRES_USER: ${POSTGRES_USER:-scraa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scraa_secret}
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    networks:
      - scraa_dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-scraa} -d ${POSTGRES_DB:-scraa}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin ───────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${DEV_COMPOSE_PROJECT_NAME:-projeto-scraa-dev}-pgadmin
    restart: unless-stopped
    ports:
      - "${DEV_PGADMIN_PORT:-${PGADMIN_PORT:-8080}}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@scraa.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    depends_on:
      database:
        condition: service_healthy
    networks:
      - scraa_dev

  # ── Migração Prisma ────────────────────────────────────────────────────────
  prisma-migrate:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: ${DEV_COMPOSE_PROJECT_NAME:-projeto-scraa-dev}-prisma-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-scraa}:${POSTGRES_PASSWORD:-scraa_secret}@database:5432/${POSTGRES_DB:-scraa}}
    volumes:
      - ./database/prisma:/app/prisma
    depends_on:
      database:
        condition: service_healthy
    networks:
      - scraa_dev

  # ── API NestJS (hot-reload via nest start --watch + debug na 9229) ─────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: ${DEV_COMPOSE_PROJECT_NAME:-projeto-scraa-dev}-api
    restart: unless-stopped
    ports:
      - "${DEV_API_PORT:-${API_PORT:-3000}}:3000"
      - "${DEV_DEBUG_PORT:-9229}:9229"
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-scraa}:${POSTGRES_PASSWORD:-scraa_secret}@database:5432/${POSTGRES_DB:-scraa}}
      PORT: 3000
    volumes:
      - ./api/src:/app/src
      - ./api/generated:/app/generated
    depends_on:
      database:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    networks:
      - scraa_dev

  # ── Frontend Angular (ng serve com polling para WSL) ──────────────────────
  web:
    build:
      context: ./client/web
      dockerfile: Dockerfile.dev
    container_name: ${DEV_COMPOSE_PROJECT_NAME:-projeto-scraa-dev}-web
    restart: unless-stopped
    ports:
      - "${DEV_WEB_PORT:-${WEB_PORT:-4200}}:4200"
    volumes:
      - ./client/web/src:/app/src
      - ./client/web/public:/app/public
    depends_on:
      - api
    networks:
      - scraa_dev

  # ── Script: sync_sigtap (Ordem 1) ─────────────────────────────────────────
  sync-sigtap:
    build:
      context: ./scripts
      dockerfile: sync_sigtap/Dockerfile.dev
    container_name: ${DEV_COMPOSE_PROJECT_NAME:-projeto-scraa-dev}-sync-sigtap
    restart: "no"
    command: ["python", "-m", "sync_sigtap", "run"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-scraa}:${POSTGRES_PASSWORD:-scraa_secret}@database:5432/${POSTGRES_DB:-scraa}}
      FTP_HOST: ${FTP_HOST:-ftp2.datasus.gov.br}
      FTP_DIR: ${FTP_DIR:-/pub/sistemas/tup/downloads/}
      FTP_TIMEOUT: ${FTP_TIMEOUT:-30}
      SCHEDULE_HOUR: ${SCHEDULE_HOUR:-0}
      SCHEDULE_MINUTE: ${SCHEDULE_MINUTE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COMPETENCIA_INICIAL: ${COMPETENCIA_INICIAL:-}
      AUTO_CONFIRM_SYNC: ${AUTO_CONFIRM_SYNC:-false}
    volumes:
      - ./scripts/sync_sigtap/src:/app/src
      - ./scripts/shared:/app/scripts/shared
    depends_on:
      database:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    networks:
      - scraa_dev
    profiles:
      - sync

  # ── Script: sync_cpa_data (Ordem 2) ───────────────────────────────────────
  sync-cpa-data:
    build:
      context: ./scripts
      dockerfile: sync_cpa_data/Dockerfile.dev
    container_name: ${DEV_COMPOSE_PROJECT_NAME:-projeto-scraa-dev}-sync-cpa-data
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-scraa}:${POSTGRES_PASSWORD:-scraa_secret}@database:5432/${POSTGRES_DB:-scraa}}
      CPA_SPREADSHEET_PATH: ${CPA_SPREADSHEET_PATH:-/app/arquivos/cpa-data/dados-cpa.xlsx}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./scripts/sync_cpa_data/src:/app/src
      - ./scripts/shared:/app/scripts/shared
      - ./scripts/arquivos:/app/arquivos
    depends_on:
      sync-sigtap:
        condition: service_completed_successfully
    networks:
      - scraa_dev
    profiles:
      - sync

  # ── Script: sync_datasus (Ordem 3) ────────────────────────────────────────
  sync-datasus:
    build:
      context: ./scripts
      dockerfile: sync_datasus/Dockerfile.dev
    container_name: ${DEV_COMPOSE_PROJECT_NAME:-projeto-scraa-dev}-sync-datasus
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-scraa}:${POSTGRES_PASSWORD:-scraa_secret}@database:5432/${POSTGRES_DB:-scraa}}
      DATASUS_UFS: ${DATASUS_UFS:-SP,RJ,MG,BA,AM}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./scripts/sync_datasus/src:/app/src
      - ./scripts/shared:/app/scripts/shared
      - ./scripts/arquivos:/app/arquivos
    depends_on:
      sync-cpa-data:
        condition: service_completed_successfully
    networks:
      - scraa_dev
    profiles:
      - sync
