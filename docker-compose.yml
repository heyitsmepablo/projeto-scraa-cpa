name: ${COMPOSE_PROJECT_NAME:-projeto-scraa}

# ==============================================================================
# Volumes isolados por namespace de instância
# ==============================================================================
volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-projeto-scraa}_postgres_data
  pgadmin_data:
    name: ${COMPOSE_PROJECT_NAME:-projeto-scraa}_pgadmin_data

# ==============================================================================
# Rede isolada por instância
# ==============================================================================
networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME:-projeto-scraa}_network
    driver: bridge

# ==============================================================================
# Serviços da aplicação
# ==============================================================================
services:
  # ── Banco de Dados (PostgreSQL 18) ──────────────────────────────────────────
  database:
    image: postgres:18
    container_name: ${COMPOSE_PROJECT_NAME:-projeto-scraa}-database
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scraa}
      POSTGRES_USER: ${POSTGRES_USER:-scraa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scraa_secret}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-scraa} -d ${POSTGRES_DB:-scraa}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migração Prisma ────────────────────────────────────────────────────────
  prisma-migrate:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-projeto-scraa}-prisma-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-scraa}:${POSTGRES_PASSWORD:-scraa_secret}@database:5432/${POSTGRES_DB:-scraa}}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network

  # ── API NestJS (Produção Compilada) ────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-projeto-scraa}-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-scraa}:${POSTGRES_PASSWORD:-scraa_secret}@database:5432/${POSTGRES_DB:-scraa}}
    depends_on:
      database:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    networks:
      - app_network

  # ── Frontend Web (Angular 22 + Nginx) ──────────────────────────────────────
  web:
    build:
      context: ./client/web
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-projeto-scraa}-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - app_network

  # ── pgAdmin (Ferramentas Administrativas) ──────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${COMPOSE_PROJECT_NAME:-projeto-scraa}-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@scraa.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network
    profiles:
      - tools

  # ── Script ETL: sync_sigtap (Ordem 1) ─────────────────────────────────────
  sync-sigtap:
    build:
      context: ./scripts
      dockerfile: sync_sigtap/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-projeto-scraa}-sync-sigtap
    restart: "no"
    command: ["python", "-m", "sync_sigtap", "run"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-scraa}:${POSTGRES_PASSWORD:-scraa_secret}@database:5432/${POSTGRES_DB:-scraa}}
      FTP_HOST: ${FTP_HOST:-ftp2.datasus.gov.br}
      FTP_DIR: ${FTP_DIR:-/pub/sistemas/tup/downloads/}
      FTP_TIMEOUT: ${FTP_TIMEOUT:-30}
      SCHEDULE_HOUR: ${SCHEDULE_HOUR:-0}
      SCHEDULE_MINUTE: ${SCHEDULE_MINUTE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COMPETENCIA_INICIAL: ${COMPETENCIA_INICIAL:-}
      AUTO_CONFIRM_SYNC: ${AUTO_CONFIRM_SYNC:-false}
    depends_on:
      database:
        condition: service_healthy
      prisma-migrate:
        condition: service_completed_successfully
    networks:
      - app_network
    profiles:
      - sync

  # ── Script ETL: sync_cpa_data (Ordem 2) ───────────────────────────────────
  sync-cpa-data:
    build:
      context: ./scripts
      dockerfile: sync_cpa_data/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-projeto-scraa}-sync-cpa-data
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-scraa}:${POSTGRES_PASSWORD:-scraa_secret}@database:5432/${POSTGRES_DB:-scraa}}
      CPA_SPREADSHEET_PATH: ${CPA_SPREADSHEET_PATH:-/app/arquivos/cpa-data/dados-cpa.xlsx}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./scripts/arquivos:/app/arquivos
    depends_on:
      sync-sigtap:
        condition: service_completed_successfully
    networks:
      - app_network
    profiles:
      - sync

  # ── Script ETL: sync_datasus (Ordem 3) ────────────────────────────────────
  sync-datasus:
    build:
      context: ./scripts
      dockerfile: sync_datasus/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-projeto-scraa}-sync-datasus
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-scraa}:${POSTGRES_PASSWORD:-scraa_secret}@database:5432/${POSTGRES_DB:-scraa}}
      DATASUS_UFS: ${DATASUS_UFS:-SP,RJ,MG,BA,AM}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./scripts/arquivos:/app/arquivos
    depends_on:
      sync-cpa-data:
        condition: service_completed_successfully
    networks:
      - app_network
    profiles:
      - sync
