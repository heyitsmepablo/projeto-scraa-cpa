<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="grid border rounded-2xl border-surface-200 dark:border-surface-800 bg-surface-0 dark:bg-surface-900 text-surface-900 dark:text-surface-0 shadow-md w-96 h-72 p-4 text-center">
  <h1 class="text-lg font-semibold text-surface-900 dark:text-surface-0">Login</h1>
  <div class="grid grid-rows-2 gap-4 mb-4">
    <input pInputText placeholder="Email" type="email" formControlName="email" />
    <p-password placeholder="Senha" formControlName="password" [toggleMask]="true" [feedback]="false"></p-password>
  </div>
  <button pButton size="large" type="submit" class="h-12" [disabled]="loginForm.invalid">Entrar</button>
</form>
