<div class="flex flex-col gap-6">
  <!-- Header Superior e Contexto com Ações -->
  <app-page-header
    title="Monitoramento de Execução de Vínculos"
    description="Auditoria física e orçamentária detalhada por procedimento contratado"
  >
    <!-- 1º Seletor de Contrato / Vínculo -->
    <div class="flex items-center gap-2">
      <span class="text-xs font-semibold uppercase text-surface-500 dark:text-surface-400 hidden sm:inline">Vínculo:</span>
      <p-select
        [options]="vinculoOptions()"
        [ngModel]="selectedVinculoId()"
        (ngModelChange)="selectedVinculoId.set($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="Selecione um Vínculo"
        styleClass="w-72 sm:w-80 text-xs shadow-xs"
        [filter]="true"
        filterPlaceholder="Buscar contrato..."
        appendTo="body"
      />
    </div>

    <!-- 2º Divisor sutil -->
    <div class="w-px h-6 bg-surface-200 dark:bg-surface-700 hidden sm:block mx-1"></div>

    <!-- 3º Seletor Temporal Reutilizável -->
    <app-temporal-selector />

    <!-- 4º Botão de Exportação Rápida CSV -->
    <p-button
      label="Exportar CSV"
      icon="pi pi-file-excel"
      severity="secondary"
      [outlined]="true"
      size="small"
      styleClass="shadow-xs text-xs"
      (onClick)="exportarDados()"
      [disabled]="procedimentosFormatados().length === 0"
      pTooltip="Exportar dados analíticos e hierárquicos em formato CSV"
    />
  </app-page-header>

  <!-- Card Hero do Vínculo Selecionado -->
  <app-monitoramento-hero [vinculo]="selectedVinculo()" />

  <!-- Grid de Metric Cards (5 Colunas: Físico vs Financeiro) -->
  <app-monitoramento-kpis
    [kpis]="kpis()"
    [mesesCount]="competenceService.mesesCount()"
  />

  <!-- Barra de Filtros e Ações da Grade Analítica -->
  <app-monitoramento-filters
    [globalFilterText]="globalFilterText()"
    [selectedStatus]="selectedStatus()"
    [selectedComplexidade]="selectedComplexidade()"
    [statusOptions]="statusOptions"
    [complexidadeOptions]="complexidadeOptions"
    [viewMode]="viewMode()"
    (filterTextChange)="globalFilterText.set($event)"
    (statusChange)="selectedStatus.set($event)"
    (complexidadeChange)="selectedComplexidade.set($event)"
    (viewModeChange)="viewMode.set($event)"
    (reset)="resetFilters()"
    (expandAll)="expandAll()"
    (collapseAll)="collapseAll()"
  />

  <!-- ÁREA DE VISUALIZAÇÃO ALTERNÁVEL: MODO 1 (p-table) OU MODO 2 (p-treetable) -->
  @if (viewMode() === 'flat') {
    <app-monitoramento-table
      [procedimentos]="procedimentosFormatados()"
      [loading]="loading()"
      [kpis]="kpis()"
      [periodoFormatado]="competenceService.periodoFormatado()"
      [mesesCount]="competenceService.mesesCount()"
      (resetFilters)="resetFilters()"
    />
  } @else {
    <app-monitoramento-tree
      [treeNodes]="treeNodes()"
      [loading]="loading()"
      [kpis]="kpis()"
      [mesesCount]="competenceService.mesesCount()"
      (expandAll)="expandAll()"
      (collapseAll)="collapseAll()"
      (resetFilters)="resetFilters()"
    />
  }
</div>
