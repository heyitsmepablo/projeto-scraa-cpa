<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
  <!-- KPI 1: Físico Pactuado -->
  <app-kpi-card
    [title]="'Físico Pactuado ' + (mesesCount() > 1 ? '(' + mesesCount() + 'm)' : '')"
    [value]="(kpis().totalPactuado | number) + ' un.'"
    icon="pi pi-bookmark"
    variant="slate"
    footerLabel="Metas no Plano:"
    [footerValue]="kpis().totalComPacto + ' itens'"
  />

  <!-- KPI 2: Físico Aprovado (DATASUS) -->
  <app-kpi-card
    title="Físico Aprovado"
    [value]="(kpis().totalAprovado | number) + ' un.'"
    icon="pi pi-check-circle"
    variant="emerald"
  >
    <div footer class="flex items-center justify-between text-xs text-surface-500 dark:text-surface-400">
      <span>Saldo Físico:</span>
      <span
        class="font-bold font-mono"
        [ngClass]="kpis().saldoFisico >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'"
      >
        {{ kpis().saldoFisico >= 0 ? '+' : '' }}{{ kpis().saldoFisico | number }} un.
      </span>
    </div>
  </app-kpi-card>

  <!-- KPI 3: Financeiro Pactuado do Período -->
  <app-kpi-card
    [title]="'Financ. Pactuado ' + (mesesCount() > 1 ? '(' + mesesCount() + 'm)' : '')"
    [value]="formatCurrency(kpis().totalFinanceiroPactuado)"
    icon="pi pi-wallet"
    variant="blue"
    footerLabel="Tabela SIGTAP:"
    [footerValue]="'Meta × ' + mesesCount() + 'm × Unit.'"
  />

  <!-- KPI 4: Financeiro Aprovado -->
  <app-kpi-card
    title="Financ. Aprovado"
    [value]="formatCurrency(kpis().totalFinanceiro)"
    icon="pi pi-dollar"
    variant="indigo"
    footerLabel="Execução Financeira:"
    [footerValue]="(kpis().percentualGlobalFinanceiro | number: '1.1-1') + '%'"
  />

  <!-- KPI 5: Saldo Financeiro Global -->
  <app-kpi-card
    title="Saldo Financeiro"
    [value]="(kpis().saldoFinanceiroGlobal >= 0 ? '+' : '') + formatCurrency(kpis().saldoFinanceiroGlobal)"
    icon="pi pi-chart-line"
    [variant]="kpis().saldoFinanceiroGlobal >= 0 ? 'emerald' : 'rose'"
  >
    <div footer class="flex items-center justify-between text-xs">
      <span class="text-surface-500">Status Saldo:</span>
      <p-tag
        [value]="kpis().statusFinanceiroGlobalLabel"
        [severity]="kpis().statusFinanceiroGlobalSeverity"
        styleClass="text-[10px]"
      />
    </div>
  </app-kpi-card>
</div>
