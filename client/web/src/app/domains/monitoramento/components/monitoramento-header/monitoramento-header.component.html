<div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
  <div>
    <div class="flex items-center gap-2">
      <h1 class="text-2xl font-bold text-surface-900 dark:text-surface-0 tracking-tight">
        Monitoramento de Execução de Vínculos
      </h1>
      <p-tag value="Plano Operativo vs DATASUS" severity="info" styleClass="text-xs" />
    </div>
    <p class="text-sm text-surface-600 dark:text-surface-400 mt-1">
      Auditoria física e orçamentária detalhada por procedimento contratado
    </p>
  </div>

  <div class="flex flex-wrap items-center gap-3">
    <!-- Seletor de Contrato / Vínculo -->
    <div class="flex items-center gap-2">
      <span class="text-xs font-semibold uppercase text-surface-500 dark:text-surface-400 hidden sm:inline">Vínculo:</span>
      <p-select
        [options]="vinculoOptions()"
        [ngModel]="selectedVinculoId()"
        (ngModelChange)="vinculoChange.emit($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="Selecione um Vínculo"
        styleClass="w-72 sm:w-80 text-xs shadow-xs"
        [filter]="true"
        filterPlaceholder="Buscar contrato..."
        appendTo="body"
      />
    </div>

    <!-- Navegação de Competência / Período Global -->
    <div class="flex items-center gap-2 bg-surface-0 dark:bg-surface-900 border border-surface-200/80 dark:border-surface-800 p-1 rounded-xl shadow-xs">
      <p-button
        icon="pi pi-chevron-left"
        [text]="true"
        severity="secondary"
        size="small"
        (onClick)="previousCompetence.emit()"
        pTooltip="Período Anterior"
      />
      
      <div class="flex flex-col items-center px-1">
        <span class="text-[9px] font-bold uppercase tracking-wider text-surface-400">
          {{ periodMode() === 'SPECIFIC' ? 'Competência' : 'Período Ativo' }}
        </span>
        <p-tag
          [value]="periodoFormatado()"
          severity="contrast"
          styleClass="text-xs font-bold px-2 py-0.5 font-mono shadow-xs"
        />
      </div>

      <p-button
        icon="pi pi-chevron-right"
        [text]="true"
        severity="secondary"
        size="small"
        (onClick)="nextCompetence.emit()"
        pTooltip="Próximo Período"
      />
    </div>

    <!-- Alternância de Visualização (Lista Plana vs Hierarquia SIGTAP) -->
    <p-selectbutton
      [options]="viewModeOptions"
      [ngModel]="viewMode()"
      (ngModelChange)="viewModeChange.emit($event)"
      optionLabel="label"
      optionValue="value"
      styleClass="text-xs shadow-xs"
      [allowEmpty]="false"
    >
      <ng-template #item let-item>
        <div class="flex items-center gap-1.5 px-1 py-0.5 text-xs font-semibold">
          <i [class]="item.icon"></i>
          <span class="hidden sm:inline">{{ item.label }}</span>
        </div>
      </ng-template>
    </p-selectbutton>

    <!-- Botão de Exportação Rápida CSV -->
    <p-button
      label="Exportar CSV"
      icon="pi pi-file-excel"
      severity="secondary"
      [outlined]="true"
      size="small"
      styleClass="shadow-xs text-xs"
      (onClick)="exportCsv.emit()"
      [disabled]="!hasData()"
      pTooltip="Exportar dados analíticos e hierárquicos em formato CSV"
    />
  </div>
</div>
