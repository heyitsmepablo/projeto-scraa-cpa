<p-card styleClass="shadow-xs border border-surface-200/80 dark:border-surface-800 bg-surface-0 dark:bg-surface-900">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 items-end">
    <!-- Campo de Busca Textual Global -->
    <div class="flex flex-col gap-1.5 sm:col-span-2 lg:col-span-2">
      <label class="text-xs font-semibold uppercase tracking-wider text-surface-700 dark:text-surface-300">
        Buscar Procedimento / SIGTAP:
      </label>
      <p-iconfield iconPosition="left">
        <p-inputicon class="pi pi-search" />
        <input
          pInputText
          type="text"
          [ngModel]="globalFilterText()"
          (ngModelChange)="filterTextChange.emit($event)"
          placeholder="Ex: 0301010072, Consulta ou Grupo..."
          class="w-full"
        />
      </p-iconfield>
    </div>

    <!-- Filtro de Status da Meta -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold uppercase tracking-wider text-surface-700 dark:text-surface-300">
        Status da Meta:
      </label>
      <p-select
        [options]="statusOptions()"
        [ngModel]="selectedStatus()"
        (ngModelChange)="statusChange.emit($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="Todos os Status"
        styleClass="w-full text-xs"
      />
    </div>

    <!-- Filtro de Complexidade -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold uppercase tracking-wider text-surface-700 dark:text-surface-300">
        Complexidade:
      </label>
      <p-select
        [options]="complexidadeOptions()"
        [ngModel]="selectedComplexidade()"
        (ngModelChange)="complexidadeChange.emit($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="Todas as Complexidades"
        styleClass="w-full text-xs"
      />
    </div>

    <!-- Botões de Ação (Limpar Filtros e Expandir/Recolher Árvore) -->
    <div class="flex items-center gap-2">
      <p-button
        label="Limpar"
        icon="pi pi-filter-slash"
        [outlined]="true"
        severity="secondary"
        styleClass="w-full text-xs"
        (onClick)="reset.emit()"
        pTooltip="Limpar todos os filtros aplicados"
      />

      @if (viewMode() === 'tree') {
        <p-button
          icon="pi pi-angle-double-down"
          [outlined]="true"
          severity="secondary"
          size="small"
          (onClick)="expandAll.emit()"
          pTooltip="Expandir Todos os Grupos e Subgrupos"
        />
        <p-button
          icon="pi pi-angle-double-up"
          [outlined]="true"
          severity="secondary"
          size="small"
          (onClick)="collapseAll.emit()"
          pTooltip="Recolher Todos os Nós"
        />
      }
    </div>
  </div>
</p-card>
