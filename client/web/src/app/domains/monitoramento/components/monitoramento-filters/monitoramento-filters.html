<p-card styleClass="shadow-xs border border-surface-200/80 dark:border-surface-800 bg-surface-0 dark:bg-surface-900">
  <div class="flex flex-col xl:flex-row items-stretch xl:items-end justify-between gap-4">
    <!-- Bloco de Filtros à Esquerda / Central -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 flex-1">
      <!-- Campo de Busca Textual Global -->
      <div class="flex flex-col gap-1.5 sm:col-span-2">
        <label class="text-xs font-semibold uppercase tracking-wider text-surface-700 dark:text-surface-300">
          Buscar Procedimento / SIGTAP:
        </label>
        <p-iconfield iconPosition="left">
          <p-inputicon class="pi pi-search" />
          <input
            pInputText
            type="text"
            [ngModel]="globalFilterText()"
            (ngModelChange)="filterTextChange.emit($event)"
            placeholder="Ex: 0301010072, Consulta ou Grupo..."
            class="w-full text-xs"
          />
        </p-iconfield>
      </div>

      <!-- Filtro de Status da Meta -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold uppercase tracking-wider text-surface-700 dark:text-surface-300">
          Status da Meta:
        </label>
        <p-select
          [options]="statusOptions()"
          [ngModel]="selectedStatus()"
          (ngModelChange)="statusChange.emit($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="Todos os Status"
          styleClass="w-full text-xs"
        />
      </div>

      <!-- Filtro de Complexidade -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold uppercase tracking-wider text-surface-700 dark:text-surface-300">
          Complexidade:
        </label>
        <p-select
          [options]="complexidadeOptions()"
          [ngModel]="selectedComplexidade()"
          (ngModelChange)="complexidadeChange.emit($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="Todas as Complexidades"
          styleClass="w-full text-xs"
        />
      </div>
    </div>

    <!-- Bloco de Ações e Alternância de Visualização à Direita -->
    <div class="flex items-center gap-2 shrink-0 pt-2 xl:pt-0 border-t xl:border-t-0 border-surface-100 dark:border-surface-800">
      <!-- Alternância de Visualização (Lista Plana vs Árvore SIGTAP) -->
      <p-selectbutton
        [options]="viewModeOptions"
        [ngModel]="viewMode()"
        (ngModelChange)="viewModeChange.emit($event)"
        optionLabel="label"
        optionValue="value"
        styleClass="text-xs shadow-xs"
        [allowEmpty]="false"
      >
        <ng-template #item let-item>
          <div class="flex items-center gap-1.5 px-2 py-0.5 text-xs font-semibold">
            <i [class]="item.icon"></i>
            <span class="hidden sm:inline">{{ item.label }}</span>
          </div>
        </ng-template>
      </p-selectbutton>

      <!-- Botões de Ação na Árvore (se viewMode === 'tree') -->
      @if (viewMode() === 'tree') {
        <p-button
          icon="pi pi-angle-double-down"
          [outlined]="true"
          severity="secondary"
          size="small"
          (onClick)="expandAll.emit()"
          pTooltip="Expandir Todos os Nós"
          tooltipPosition="top"
        />
        <p-button
          icon="pi pi-angle-double-up"
          [outlined]="true"
          severity="secondary"
          size="small"
          (onClick)="collapseAll.emit()"
          pTooltip="Recolher Todos os Nós"
          tooltipPosition="top"
        />
      }

      <!-- Limpar Filtros -->
      <p-button
        label="Limpar"
        icon="pi pi-filter-slash"
        [outlined]="true"
        severity="secondary"
        size="small"
        styleClass="text-xs whitespace-nowrap"
        (onClick)="reset.emit()"
        pTooltip="Limpar todos os filtros aplicados"
        tooltipPosition="top"
      />
    </div>
  </div>
</p-card>
