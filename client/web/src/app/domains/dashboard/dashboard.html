<div class="flex flex-col gap-6">
  <!-- Header Superior do Dashboard -->
  <app-page-header
    title="Dashboard Executivo CPA"
    description="Painel consolidado de apuração de produção SUS: Executado vs. Pactuado nos Planos Operativos"
  >
    <p-button
      icon="pi pi-chevron-left"
      [text]="true"
      severity="secondary"
      size="small"
      (onClick)="competenceService.previousCompetence()"
      pTooltip="Período Anterior"
    />
    
    <div class="flex flex-col items-center">
      <span class="text-[10px] font-bold uppercase tracking-wider text-surface-500 dark:text-surface-400">
        {{ competenceService.periodMode() === 'SPECIFIC' ? 'Competência Ativa' : 'Período Ativo' }}
      </span>
      <p-tag
        [value]="competenceService.periodoFormatado()"
        severity="info"
        styleClass="text-sm font-bold px-3 py-1 font-mono shadow-xs"
      />
    </div>

    <p-button
      icon="pi pi-chevron-right"
      [text]="true"
      severity="secondary"
      size="small"
      (onClick)="competenceService.nextCompetence()"
      pTooltip="Próximo Período"
    />
  </app-page-header>

  <!-- Barra de Filtros Estratégicos -->
  <app-dashboard-filters
    [instituicaoOptions]="instituicaoOptions()"
    [selectedInstituicaoCnes]="selectedInstituicaoCnes()"
    [selectedQuadrimestre]="selectedQuadrimestre()"
    [selectedStatusExecucao]="selectedStatusExecucao()"
    [quadrimestreOptions]="quadrimestreOptions"
    [statusOptions]="statusOptions"
    (instituicaoChange)="selectedInstituicaoCnes.set($event)"
    (quadrimestreChange)="selectedQuadrimestre.set($event)"
    (statusChange)="selectedStatusExecucao.set($event)"
    (reset)="resetFilters()"
  />

  <!-- Grid de Metric Cards (KPIs) -->
  <app-dashboard-kpis
    [kpis]="kpis()"
    [mesesCount]="competenceService.mesesCount()"
  />

  <!-- Gráfico Comparativo: Pactuado vs. Aprovado -->
  <app-dashboard-chart
    [chartData]="chartData()"
    [chartOptions]="chartOptions"
    [mesesCount]="competenceService.mesesCount()"
  />

  <!-- Banner de Ação para Monitoramento Analítico -->
  <app-dashboard-cta />
</div>
