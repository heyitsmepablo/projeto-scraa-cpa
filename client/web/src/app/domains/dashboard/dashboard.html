<div class="flex flex-col gap-6">
  <!-- Header Superior do Dashboard -->
  <app-page-header
    title="Dashboard Executivo CPA"
    description="Painel consolidado de apuração de produção SUS: Executado vs. Pactuado nos Planos Operativos"
  >
    <app-temporal-selector />
  </app-page-header>

  <!-- Barra de Filtros Estratégicos -->
  <app-dashboard-filters
    [instituicaoOptions]="instituicaoOptions()"
    [selectedInstituicaoCnes]="selectedInstituicaoCnes()"
    [selectedStatusExecucao]="selectedStatusExecucao()"
    [statusOptions]="statusOptions"
    (instituicaoChange)="selectedInstituicaoCnes.set($event)"
    (statusChange)="selectedStatusExecucao.set($event)"
    (reset)="resetFilters()"
  />

  <!-- Grid de Metric Cards (KPIs) -->
  <app-dashboard-kpis
    [kpis]="kpis()"
    [mesesCount]="competenceService.mesesCount()"
  />

  <!-- Gráfico Comparativo: Pactuado vs. Aprovado -->
  <app-dashboard-chart
    [chartData]="chartData()"
    [chartOptions]="chartOptions"
    [mesesCount]="competenceService.mesesCount()"
  />

  <!-- Banner de Ação para Monitoramento Analítico -->
  <app-dashboard-cta />
</div>
