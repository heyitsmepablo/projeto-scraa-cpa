<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
  <!-- KPI 1: Total Valor Aprovado -->
  <app-kpi-card
    title="Total Aprovado (R$)"
    [value]="formatCurrency(kpis().totalValorAprovado)"
    icon="pi pi-wallet"
    variant="emerald"
    footerLabel="Físico Aprovado:"
    [footerValue]="(kpis().totalQtdAprovada | number) + ' un.'"
  />

  <!-- KPI 2: Total Valor Produzido -->
  <app-kpi-card
    title="Total Apresentado (R$)"
    [value]="formatCurrency(kpis().totalValorProduzido)"
    icon="pi pi-chart-line"
    variant="blue"
    footerLabel="Físico Apresentado:"
    [footerValue]="(kpis().totalQtdProduzida | number) + ' un.'"
  />

  <!-- KPI 3: % Execução Geral -->
  <app-kpi-card
    title="Execução de Metas"
    [value]="(kpis().taxaExecucaoGeral | number: '1.1-1') + '%'"
    icon="pi pi-percentage"
    variant="indigo"
    footerLabel="Meta Pactuada:"
    [footerValue]="(kpis().totalQtdPactuada | number) + ' un.' + (mesesCount() > 1 ? ' (' + mesesCount() + 'm)' : '')"
  >
    <p-tag
      value-extra
      [value]="kpis().statusGeralLabel"
      [severity]="kpis().statusGeralSeverity"
      styleClass="text-xs font-semibold"
    />
  </app-kpi-card>

  <!-- KPI 4: Itens & Alertas -->
  <app-kpi-card
    title="Procedimentos Auditados"
    [value]="kpis().totalProcedimentos"
    icon="pi pi-list-check"
    variant="amber"
  >
    <div footer class="flex items-center gap-2 text-xs">
      <span class="text-emerald-600 font-bold font-mono">✓ {{ kpis().totalDentro }}</span>
      <span class="text-amber-600 font-bold font-mono">▲ {{ kpis().totalAcima }}</span>
      <span class="text-rose-600 font-bold font-mono">▼ {{ kpis().totalAbaixo }}</span>
      <span class="text-surface-500 font-bold font-mono">⚪ {{ kpis().totalSemPacto }}</span>
    </div>
  </app-kpi-card>
</div>
