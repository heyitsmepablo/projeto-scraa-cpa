<div class="flex flex-col gap-6">
  <app-page-header
    title="Vínculos Jurídicos & Contratos"
    description="Gestão de Convênios, Contratos Administrativos, Aditivos e Vigências"
  >
    <div class="flex items-center gap-3">
      <span class="text-xs font-medium text-surface-500 dark:text-surface-400">Competência:</span>
      <p-tag [value]="competenceService.competenciaFormatada()" severity="info" styleClass="font-mono shadow-xs" />
    </div>
  </app-page-header>

  <app-vinculos-table
    [vinculos]="vinculos() ?? []"
    [loading]="loading()"
    [expandedRows]="expandedRows()"
    (expandedRowsChange)="onExpandedRowsChange($event)"
  />
</div>
