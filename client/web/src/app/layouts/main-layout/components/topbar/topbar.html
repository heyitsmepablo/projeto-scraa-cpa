<header class="h-16 border-b border-surface-200/80 dark:border-surface-800 bg-surface-0/95 backdrop-blur-xs dark:bg-surface-900 px-4 flex items-center justify-between shadow-xs sticky top-0 z-20 transition-colors">
  <!-- Lado Esquerdo: Toggle Sidebar e Logo/Título -->
  <div class="flex items-center gap-3">
    <p-button
      icon="pi pi-bars"
      [text]="true"
      severity="secondary"
      (onClick)="toggleSidebar.emit()"
      ariaLabel="Alternar Menu"
      class="p-button-rounded"
    />
    <div class="flex items-center gap-2">
      <span class="flex items-center justify-center w-8 h-8 rounded-lg bg-primary-600 text-white font-black text-sm shadow-xs">
        CPA
      </span>
      <div class="hidden sm:flex flex-col">
        <span class="font-bold text-sm text-surface-900 dark:text-surface-0 leading-tight">SCRAA-CPA</span>
        <span class="text-xs text-surface-500 dark:text-surface-400">Contratos & Planos Operativos SUS</span>
      </div>
    </div>
  </div>

  <!-- Lado Direito: Alternância de Tema -->
  <div class="flex items-center gap-2 sm:gap-3">
    <!-- Botão de Alternância de Tema Claro / Escuro -->
    <p-button
      [icon]="themeService.isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"
      [text]="true"
      severity="secondary"
      class="p-button-rounded"
      (onClick)="themeService.toggleTheme()"
      [ariaLabel]="themeService.isDarkMode() ? 'Alternar para tema claro' : 'Alternar para tema escuro'"
      [pTooltip]="themeService.isDarkMode() ? 'Mudar para tema claro' : 'Mudar para tema escuro'"
      tooltipPosition="bottom"
    />
  </div>
</header>
