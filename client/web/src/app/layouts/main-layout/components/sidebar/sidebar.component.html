<aside
  class="h-[calc(100vh-4rem)] w-64 bg-surface-0 dark:bg-surface-900 border-r border-surface-200/80 dark:border-surface-800 flex flex-col justify-between transition-all duration-300 z-10"
>
  <div class="p-3 flex-1 flex flex-col gap-1">
    <div class="px-3 py-2 text-xs font-bold uppercase tracking-wider text-surface-500 dark:text-surface-400">
      Módulos CPA
    </div>

    <nav class="flex flex-col gap-1">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-primary-50 dark:bg-primary-950/60 text-primary-700 dark:text-primary-300 font-semibold border-l-4 border-primary-600 dark:border-primary-400 shadow-xs"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="onNavigate()"
          class="flex items-center gap-3 px-3 py-2.5 rounded-r-lg text-sm text-surface-700 dark:text-surface-300 hover:bg-surface-100 hover:text-surface-900 dark:hover:bg-surface-800 dark:hover:text-surface-0 font-medium transition-colors"
        >
          <i [class]="item.icon + ' text-base'"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>

  <div class="p-4 border-t border-surface-200/80 dark:border-surface-800 text-xs text-surface-500 dark:text-surface-400 flex flex-col gap-1">
    <div class="flex items-center justify-between">
      <span>Versão 1.0.0</span>
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 shadow-xs" title="Online"></span>
    </div>
    <span>Monitoramento SUS</span>
  </div>
</aside>
