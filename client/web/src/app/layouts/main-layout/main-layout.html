<div class="min-h-screen flex flex-col bg-surface-50 dark:bg-surface-950 text-surface-900 dark:text-surface-0">
  <app-topbar (toggleSidebar)="toggleSidebar()" />

  <div class="flex flex-1 relative overflow-hidden bg-surface-50 dark:bg-surface-950">
    <!-- Sidebar no Mobile com Backdrop -->
    @if (isMobile() && isSidebarOpen()) {
      <div
        class="fixed inset-0 top-16 bg-black/40 backdrop-blur-xs z-30 transition-opacity"
        (click)="closeSidebar()"
      ></div>
      <div class="fixed top-16 left-0 bottom-0 z-40 shadow-xl animate-fadein">
        <app-sidebar
          [isOpen]="isSidebarOpen()"
          [isMobile]="isMobile()"
          (closeSidebar)="closeSidebar()"
        />
      </div>
    }

    <!-- Sidebar no Desktop -->
    @if (!isMobile() && isSidebarOpen()) {
      <app-sidebar
        [isOpen]="isSidebarOpen()"
        [isMobile]="isMobile()"
        (closeSidebar)="closeSidebar()"
      />
    }

    <!-- Conteúdo Principal -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 bg-surface-50 dark:bg-surface-950">
      <div class="max-w-7xl mx-auto">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
