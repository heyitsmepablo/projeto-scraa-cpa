<p-card class="shadow-xs border border-surface-200/80 dark:border-surface-800 bg-surface-0 dark:bg-surface-900 hover:shadow-sm transition-all h-full">
  <div class="flex items-center justify-between">
    <div>
      <span class="text-xs font-bold text-surface-500 dark:text-surface-400 uppercase tracking-wider">
        {{ title() }}
      </span>
      <div class="text-2xl font-extrabold mt-1 font-mono flex items-center gap-2" [ngClass]="resolvedValueClass()">
        <span>{{ value() }}</span>
        <ng-content select="[value-extra]" />
      </div>
    </div>
    @if (icon()) {
      <div
        class="w-10 h-10 md:w-11 md:h-11 rounded-xl flex items-center justify-center text-lg md:text-xl shadow-xs"
        [ngClass]="resolvedIconClass()"
      >
        <i [class]="icon()"></i>
      </div>
    }
  </div>

  @if (footerLabel() || footerValue() !== undefined) {
    <div class="mt-3 flex items-center justify-between text-xs text-surface-500 dark:text-surface-400">
      @if (footerLabel()) {
        <span>{{ footerLabel() }}</span>
      }
      @if (footerValue() !== undefined) {
        <span class="font-bold text-surface-800 dark:text-surface-200 font-mono">{{ footerValue() }}</span>
      }
    </div>
  }
  <ng-content select="[footer]" />
</p-card>
